services:
  db:
    image: postgres:15-alpine
    container_name: aihub_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ai_signal_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app 

  frontend:
      build: ./frontend
      container_name: ai_signal_fronted
      restart: unless-stopped
      environment:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      ports:
        - "5173:5173"
      volumes:
        - ./frontend:/app
        - /app/node_modules 
      depends_on:
        - backend

  admin:
      build: ./admin
      container_name: ai_signal_admin
      restart: unless-stopped
      environment:
        VITE_API_URL: ${VITE_API_URL}
      ports:
        - "5174:5174"
      volumes:
        - ./admin:/app
        - /app/node_modules
      depends_on:
        - backend

volumes:
  postgres_data:
